services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: Express
    ports:
      - "11433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${SA_PASSWORD} -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./back-end
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=NoExcusesFit;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      JwtSettings__Secret: "${JWT_SECRET}"
      JwtSettings__Issuer: NoExcusesFit
      JwtSettings__Audience: NoExcusesFit
      JwtSettings__ExpiresInMinutes: "15"
      JwtSettings__RefreshTokenExpiresInDays: "7"
      Cors__AllowedOrigins: "http://localhost"
    depends_on:
      sqlserver:
        condition: service_healthy

  worker:
    build:
      context: ./back-end
      dockerfile: Dockerfile.worker
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=NoExcusesFit;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost/api"
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  sqldata: